# Rust workspace for the YT-DLP Downloader rewrite.
#
# This workspace is the only implementation: the original C#/.NET app has been
# removed now that the Rust port reached feature parity.
#
# Phase 1 ports `YtDlpDownloader.Core` (models + services) into `crates/ytdlp-core`.
# Phase 2 adds the Tauri + Svelte desktop shell in `apps/desktop/src-tauri`.
#
# NOTE: building the whole workspace requires the web frontend to be built first
# (`npm install && npm run build` inside `apps/desktop`), because `tauri-build`
# embeds `apps/desktop/dist` at compile time. Core-only work can always use
# `cargo test -p ytdlp-downloader-core` without that step.

[workspace]
resolver = "2"
members = ["crates/ytdlp-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-YT-DLP-Downloader-NonCommercial-ShareAlike-1.0"
authors = ["YT-DLP Downloader contributors"]
repository = "https://github.com/linyaocrush/YT-DLP-Downloader"

[workspace.dependencies]
async-trait = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
] }
url = "2"

[profile.release]
lto = true
codegen-units = 1